<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Facebook</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-left">
      <a class="logo" aria-label="Facebook home">
        <svg viewBox="0 0 36 36" width="40" height="40" aria-hidden="true">
          <circle cx="18" cy="18" r="18" fill="#1877f2" />
          <path fill="#fff" d="M24.7 23.1l.7-4.6h-4.4v-3c0-1.3.6-2.5 2.6-2.5h2V9.1s-1.8-.3-3.6-.3c-3.6 0-6 2.2-6 6.2v3.5h-4v4.6h4v11.1a17.9 17.9 0 005.5 0V23.1h3.2z"/>
        </svg>
      </a>
      <div class="search" role="search">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="#606770" d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 10-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0A4.5 4.5 0 116 9.5 4.5 4.5 0 019.5 14z"/></svg>
        <input type="text" placeholder="Search Facebook" aria-label="Search Facebook" />
      </div>
    </div>

    <nav class="topbar-center" aria-label="Primary">
      <a class="tab active" title="Home"><svg viewBox="0 0 24 24" width="26" height="26"><path fill="#1877f2" d="M12 3l9 8h-3v9h-4v-6h-4v6H6v-9H3z"/></svg></a>
      <a class="tab" title="Watch"><svg viewBox="0 0 24 24" width="26" height="26"><path fill="#606770" d="M4 4h16a1 1 0 011 1v14a1 1 0 01-1 1H4a1 1 0 01-1-1V5a1 1 0 011-1zm6 4v8l6-4z"/></svg></a>
      <a class="tab" title="Marketplace"><svg viewBox="0 0 24 24" width="26" height="26"><path fill="#606770" d="M4 4h16l1 5H3zM4 10h16v10H4zM9 13v2h6v-2z"/></svg></a>
      <a class="tab" title="Groups"><svg viewBox="0 0 24 24" width="26" height="26"><path fill="#606770" d="M8 11a4 4 0 100-8 4 4 0 000 8zm8 0a3 3 0 100-6 3 3 0 000 6zM2 20c0-3 3-5 6-5s6 2 6 5H2zm13.5-5c2.5 0 4.5 1.5 4.5 4h-5c0-1.6-.6-3-1.6-4 .7-.4 1.4-.6 2.1-.6z"/></svg></a>
    </nav>

    <div class="topbar-right">
      <button class="chip" title="Menu"><svg viewBox="0 0 24 24" width="20" height="20"><circle cx="6" cy="12" r="2" fill="#050505"/><circle cx="12" cy="12" r="2" fill="#050505"/><circle cx="18" cy="12" r="2" fill="#050505"/></svg></button>
      <button class="chip" title="Messenger"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="#050505" d="M12 2C6.5 2 2 6.1 2 11.2c0 2.9 1.4 5.5 3.6 7.2V22l3.3-1.8c.9.3 2 .4 3.1.4 5.5 0 10-4.1 10-9.4S17.5 2 12 2zm1 12.4l-2.5-2.7-5 2.7L11 8.6l2.6 2.7 4.9-2.7-5.5 5.8z"/></svg></button>
      <button class="chip" title="Notifications"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="#050505" d="M12 22a2.5 2.5 0 002.5-2.5h-5A2.5 2.5 0 0012 22zm7-5v-6a7 7 0 00-5-6.7V3a2 2 0 10-4 0v1.3a7 7 0 00-5 6.7v6l-2 2v1h18v-1l-2-2z"/></svg></button>
      <button class="avatar-btn" title="Your profile"><span class="avatar me">You</span></button>
    </div>
  </header>

  <div class="layout">
    <!-- Left sidebar -->
    <aside class="sidebar left">
      <a class="nav-item"><span class="avatar me sm">You</span> Your profile</a>
      <a class="nav-item"><span class="ic">👥</span> Friends</a>
      <a class="nav-item"><span class="ic">🕘</span> Memories</a>
      <a class="nav-item"><span class="ic">💾</span> Saved</a>
      <a class="nav-item"><span class="ic">👨‍👩‍👧</span> Groups</a>
      <a class="nav-item"><span class="ic">🎬</span> Video</a>
      <a class="nav-item"><span class="ic">🛒</span> Marketplace</a>
      <a class="nav-item"><span class="ic">📰</span> Feeds</a>
      <a class="nav-item"><span class="ic">⚙️</span> Settings</a>
    </aside>

    <!-- Feed -->
    <main class="feed" id="feed">
      <section class="stories" id="stories"></section>

      <section class="card composer">
        <div class="composer-top">
          <span class="avatar me">You</span>
          <button class="composer-input" id="composerInput">What's on your mind?</button>
        </div>
        <div class="composer-actions">
          <button class="cmp" data-icon="🎥">Live video</button>
          <button class="cmp" data-icon="🖼️">Photo/video</button>
          <button class="cmp" data-icon="😊">Feeling/activity</button>
        </div>
      </section>

      <div id="posts"></div>

      <div class="loader" id="sentinel"><span class="spinner"></span> Loading more posts…</div>
    </main>

    <!-- Right sidebar -->
    <aside class="sidebar right">
      <h4>Contacts</h4>
      <a class="contact"><span class="presence online"></span><span class="avatar a3 sm">MR</span> Marta R.</a>
      <a class="contact"><span class="presence online"></span><span class="avatar a5 sm">JB</span> Janek B.</a>
      <a class="contact"><span class="presence"></span><span class="avatar a7 sm">KW</span> Kasia W.</a>
      <a class="contact"><span class="presence online"></span><span class="avatar a2 sm">PM</span> Piotr M.</a>
      <a class="contact"><span class="presence"></span><span class="avatar a9 sm">AN</span> Ania N.</a>
      <div class="right-ad">
        <div class="ad-label">Sponsored</div>
        <div class="ad-body">
          <div class="ad-img">🧴</div>
          <div>
            <strong>NutriGlow™ AI Water Bottle</strong>
            <p>It hydrates you before you even feel thirsty. Pre-order now.</p>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
