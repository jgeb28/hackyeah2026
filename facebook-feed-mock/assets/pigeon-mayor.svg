<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="AI-style image of a pigeon in a suit at a mayoral podium">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9a0"/>
      <stop offset="0.5" stop-color="#a8d8ff"/>
      <stop offset="1" stop-color="#6ea8fe"/>
    </linearGradient>
    <linearGradient id="podium" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a2b"/>
      <stop offset="1" stop-color="#5c3a17"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fff6"/>
      <stop offset="1" stop-color="#fff0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#sky)"/>
  <circle cx="980" cy="130" r="70" fill="#fff3b0" opacity="0.85"/>
  <ellipse cx="600" cy="470" rx="520" ry="40" fill="#00000018"/>

  <!-- banner (AI text is a little... off) -->
  <g transform="translate(300 36)">
    <rect width="600" height="96" rx="10" fill="#c62828" stroke="#7f1d1d" stroke-width="4"/>
    <text x="300" y="42" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="34" fill="#fff">MAYOR PIGEON 2O26</text>
    <text x="300" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#ffe08a">MORE CRUMBS • FEWER TRAFFIC LIGTHS</text>
  </g>

  <!-- pigeon -->
  <g>
    <!-- body -->
    <ellipse cx="600" cy="430" rx="130" ry="150" fill="#9aa0a6"/>
    <ellipse cx="600" cy="450" rx="90" ry="120" fill="#c7ccd1"/>
    <!-- suit jacket -->
    <path d="M470 380 Q500 560 600 570 Q700 560 730 380 Q660 350 600 350 Q540 350 470 380 Z" fill="#1f2733"/>
    <!-- shirt -->
    <path d="M575 355 L600 560 L625 355 Z" fill="#f4f6f8"/>
    <!-- tie -->
    <path d="M600 360 L585 400 L600 470 L615 400 Z" fill="#c62828"/>
    <!-- collar -->
    <path d="M560 350 L600 400 L640 350 L620 345 L600 375 L580 345 Z" fill="#fff"/>

    <!-- left wing / arm waving -->
    <path d="M480 400 Q380 340 360 260 Q400 250 430 300 Q470 350 500 380 Z" fill="#8f959b"/>
    <!-- right wing / arm -->
    <path d="M720 400 Q820 360 850 300 Q820 280 790 300 Q740 340 700 380 Z" fill="#8f959b"/>
    <!-- extra little hand (AI artifact) -->
    <g fill="#f2c14e">
      <circle cx="356" cy="256" r="10"/>
      <circle cx="336" cy="250" r="9"/>
      <circle cx="322" cy="262" r="9"/>
      <circle cx="340" cy="272" r="9"/>
      <circle cx="360" cy="276" r="9"/>
    </g>

    <!-- head -->
    <circle cx="600" cy="270" r="72" fill="#b7bcc2"/>
    <!-- neck fluff -->
    <circle cx="600" cy="330" r="52" fill="#cdd2d7"/>
    <!-- cheeks -->
    <circle cx="566" cy="286" r="20" fill="#e88f9c" opacity="0.7"/>
    <circle cx="634" cy="286" r="20" fill="#e88f9c" opacity="0.7"/>

    <!-- eyes: two normal + one suspicious extra -->
    <circle cx="572" cy="258" r="15" fill="#fff"/>
    <circle cx="628" cy="258" r="15" fill="#fff"/>
    <circle cx="572" cy="258" r="7" fill="#111"/>
    <circle cx="628" cy="258" r="7" fill="#111"/>
    <circle cx="574" cy="255" r="2" fill="#fff"/>
    <circle cx="630" cy="255" r="2" fill="#fff"/>
    <circle cx="600" cy="228" r="10" fill="#fff" stroke="#8a8f99" stroke-width="2"/>
    <circle cx="600" cy="228" r="4" fill="#111"/>

    <!-- beak -->
    <path d="M600 292 L576 318 L600 330 L624 318 Z" fill="#f2a33c"/>
    <path d="M600 292 L600 330" stroke="#c97f1f" stroke-width="3"/>
    <!-- duplicate ghost beak (AI glitch) -->
    <path d="M660 300 L690 312 L660 326 Z" fill="#f2a33c" opacity="0.55"/>
  </g>

  <!-- podium -->
  <g>
    <path d="M500 470 L700 470 L740 675 L460 675 Z" fill="url(#podium)"/>
    <rect x="500" y="470" width="200" height="26" fill="#a06a33"/>
    <ellipse cx="600" cy="486" rx="80" ry="12" fill="#3a240d" opacity="0.35"/>
    <text x="600" y="560" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="34" fill="#f6e3c5">MAYOR</text>
    <text x="600" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#e9d3ab">(probably)</text>
  </g>

  <!-- microphones -->
  <g stroke="#3c3c3c" stroke-width="8" fill="none">
    <line x1="470" y1="470" x2="440" y2="560"/>
    <line x1="730" y1="470" x2="760" y2="560"/>
  </g>
  <ellipse cx="438" cy="462" rx="18" ry="10" fill="#2b2b2b"/>
  <ellipse cx="762" cy="462" rx="18" ry="10" fill="#2b2b2b"/>

  <!-- crowd -->
  <g>
    <ellipse cx="140" cy="640" rx="60" ry="45" fill="#5c6bc0"/>
    <circle cx="140" cy="590" r="28" fill="#ffcc80"/>
    <ellipse cx="300" cy="655" rx="58" ry="42" fill="#66bb6a"/>
    <circle cx="300" cy="608" r="26" fill="#f8bbd0"/>
    <ellipse cx="900" cy="650" rx="60" ry="44" fill="#ef5350"/>
    <circle cx="900" cy="600" r="27" fill="#ffe0b2"/>
    <ellipse cx="1060" cy="640" rx="56" ry="40" fill="#42a5f5"/>
    <circle cx="1060" cy="595" r="25" fill="#d1c4e9"/>
  </g>

  <!-- floating AI artifacts -->
  <ellipse cx="600" cy="80" rx="180" ry="60" fill="url(#glow)"/>
  <text x="800" y="180" font-family="Arial, sans-serif" font-size="16" fill="#ffffffcc" transform="rotate(-8 800 180)">wromg text but ok</text>
  <circle cx="220" cy="150" r="6" fill="#ffffffaa"/>
  <circle cx="980" cy="360" r="5" fill="#ffffffaa"/>
</svg>
